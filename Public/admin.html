<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AttendEase • Faculty</title><link rel="stylesheet" href="/style.css"><style>.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.panel{background:#fff;border-radius:18px;padding:18px;margin:16px 0;box-shadow:0 6px 24px #00000010}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}input,button{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;font-size:15px;box-sizing:border-box}button{cursor:pointer;border:0;background:#222;color:#fff}.danger{background:#c62828}.light{background:#eee;color:#222}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.student{border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin:10px 0}.muted{color:#666;font-size:13px}.success{color:green}.error{color:#c62828}</style></head><body><div class="wrap"><div class="top"><div><h1>Faculty Dashboard</h1><div class="muted">Manage students, attendance and account</div></div><button id="logout" style="width:auto">Logout</button></div>
<div class="panel"><h2>Add Student</h2><div class="grid"><input id="n" placeholder="Student name"><input id="r" placeholder="Roll number"><input id="p" placeholder="Password (default = roll number)"></div><br><button onclick="addStudent()">+ Add Student</button><p id="msg"></p></div>
<div class="panel"><h2>Change Admin Password</h2><div class="grid"><input id="oldpw" type="password" placeholder="Current password"><input id="newpw" type="password" placeholder="New password (6+ characters)"></div><br><button onclick="changePassword()">Change Password</button><p id="pwmsg"></p></div>
<div class="panel"><h2>Students (<span id="count">0</span>)</h2><input id="search" placeholder="Search name or roll number"><div id="table"></div></div>
<div id="editCard" class="panel" style="display:none"><h2>Edit Student</h2><input type="hidden" id="eid"><div class="grid"><input id="ename" placeholder="Name"><input id="eroll" placeholder="Roll number"><input id="epass" placeholder="New password (optional)"></div><br><div class="row"><button onclick="saveEdit()">Save Changes</button><button class="light" onclick="closeEdit()">Cancel</button></div></div>
<div id="historyCard" class="panel" style="display:none"><h2 id="htitle">Attendance</h2><div id="history"></div></div></div><script src="/admin.js"></script></body></html>
