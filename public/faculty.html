<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AttendEase • Faculty</title><link rel="stylesheet" href="style.css">
<style>
body{background:#f5f7fb}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.card{background:white;border-radius:18px;padding:18px;margin:16px 0;box-shadow:0 6px 24px #00000010}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}input,select,button{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;font-size:15px;box-sizing:border-box}button{cursor:pointer;border:0;background:#222;color:white}.danger{background:#c62828}.light{background:#eee;color:#222}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.student{border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin:10px 0}.muted{color:#666;font-size:13px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;margin:2px}
</style></head>
<body><div class="wrap">
<div class="top"><div><h1>Faculty Dashboard</h1><div class="muted">Manage members, details and attendance</div></div><button id="logout" style="width:auto">Logout</button></div>
<div class="card"><h2>Add Member</h2><div class="grid"><input id="name" placeholder="Student name"><input id="roll" placeholder="Roll number"><input id="pass" placeholder="Password (default = roll number)"></div><br><button onclick="addStudent()">+ Add Member</button></div>
<div class="card"><h2>Members</h2><div id="list">Loading...</div></div>
<div id="editCard" class="card" style="display:none"><h2>Edit Member</h2><input type="hidden" id="eid"><div class="grid"><input id="ename" placeholder="Name"><input id="eroll" placeholder="Roll number"><input id="epass" placeholder="New password (optional)"></div><br><div class="row"><button onclick="saveEdit()">Save Changes</button><button class="light" onclick="closeEdit()">Cancel</button></div></div>
<div id="historyCard" class="card" style="display:none"><h2 id="htitle">Attendance</h2><div id="history"></div></div>
</div>
<script>
const $=x=>document.querySelector(x);
async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Something went wrong');return d}
async function load(){try{const d=await api('/api/faculty/students');$('#list').innerHTML=d.students.length?d.students.map(s=>`
<div class="student"><b>${esc(s.name)}</b> <span class="badge">${esc(s.roll_number)}</span>
<div class="muted">Total: ${s.total} • Present: ${s.attended} • Absent: ${s.absent} • ${s.percentage}%</div>
<div class="row" style="margin-top:9px"><button onclick="edit(${s.id},'${js(s.name)}','${js(s.roll_number)}')">Edit Details</button><button class="light" onclick="view(${s.id},'${js(s.name)}')">Attendance</button><button class="danger" onclick="del(${s.id},'${js(s.name)}')">Delete</button></div></div>`).join(''):'No members yet.'}catch(e){alert(e.message);location.href='index.html'}}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function js(x){return String(x).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
async function addStudent(){try{await api('/api/faculty/students',{method:'POST',body:JSON.stringify({name:$('#name').value,roll_number:$('#roll').value,password:$('#pass').value})});$('#name').value=$('#roll').value=$('#pass').value='';await load();alert('Member added successfully')}catch(e){alert(e.message)}}
function edit(id,name,roll){$('#editCard').style.display='block';$('#eid').value=id;$('#ename').value=name;$('#eroll').value=roll;$('#epass').value='';scrollTo(0,document.body.scrollHeight)}
function closeEdit(){$('#editCard').style.display='none'}
async function saveEdit(){try{await api('/api/faculty/students/'+$('#eid').value,{method:'PUT',body:JSON.stringify({name:$('#ename').value,roll_number:$('#eroll').value,password:$('#epass').value})});closeEdit();await load();alert('Details updated')}catch(e){alert(e.message)}}
async function del(id,name){if(!confirm('Delete '+name+' and all attendance records?'))return;try{await api('/api/faculty/students/'+id,{method:'DELETE'});await load()}catch(e){alert(e.message)}}
async function view(id,name){try{const d=await api('/api/faculty/students/'+id+'/attendance');$('#historyCard').style.display='block';$('#htitle').textContent=name+' — Attendance History';$('#history').innerHTML=d.history.length?d.history.map(a=>`<div class="student"><b>${a.attendance_date}</b> — ${a.status}<div class="muted">${new Date(a.marked_at).toLocaleString()}</div><div class="row"><button onclick="changeAtt(${a.id},'${a.status==='Present'?'Absent':'Present'}')">Change to ${a.status==='Present'?'Absent':'Present'}</button><button class="danger" onclick="deleteAtt(${a.id},${id},'${js(name)}')">Delete</button></div></div>`).join(''):'No attendance records.';scrollTo(0,document.body.scrollHeight)}catch(e){alert(e.message)}}
async function changeAtt(id,status){try{await api('/api/faculty/attendance/'+id,{method:'PUT',body:JSON.stringify({status})});await load()}catch(e){alert(e.message)}}
async function deleteAtt(id,sid,name){if(!confirm('Delete this attendance record?'))return;try{await api('/api/faculty/attendance/'+id,{method:'DELETE'});await view(sid,name);await load()}catch(e){alert(e.message)}}
$('#logout').onclick=async()=>{await api('/api/logout',{method:'POST'});location.href='index.html'};load();
</script></body></html>
